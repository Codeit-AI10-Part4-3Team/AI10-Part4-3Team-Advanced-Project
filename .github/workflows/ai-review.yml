# .github/workflows/ai-review.yml
name: AI review

# LLM 기반 맥락 리뷰 — Greptile을 대체합니다(월 결제가 필요해 도입하지 않았습니다).
#
# 사전 작업 2개 — 하나만 해서는 동작하지 않습니다:
#   1. Claude GitHub App 설치 (https://github.com/apps/claude)
#      ⚠️ 없으면 `Claude Code is not installed on this repository` 로 실패합니다.
#         아래 시크릿 가드는 키만 검사하므로 이 상태를 걸러 주지 못합니다.
#   2. ANTHROPIC_API_KEY 시크릿 등록 (없으면 실패 대신 스킵)
#
# reviewdog(결정론적 린트)·SonarQube(정적 분석)와 같은 계층의 **보조 리뷰어**이고,
# 하드 게이트는 ci.yml(ruff / mypy / pytest)이 담당합니다.
#
# ⚠️ required status check로 지정하지 마세요. 세 가지 상황에서 체크가 아예 생성되지 않고,
#    그 순간 모든 PR이 영구히 "Expected" 상태로 머지 블록됩니다:
#      (1) 아래 fork 가드로 외부 기여자 PR에서는 잡이 스킵됩니다
#      (2) ANTHROPIC_API_KEY 미등록 시 스킵됩니다
#      (3) API 크레딧 소진·외부 서비스 장애 시 실패합니다
#    scripts/setup-github.sh의 contexts에 넣지 않는 이유가 이것입니다
#    (reviewdog / SonarQube와 동일한 결정 — docs/공통_가이드/저장소_운영.md §8).
#
# ⚠️ pull_request_target으로 바꾸지 마세요. fork의 코드를 write 권한 + 시크릿 접근 컨텍스트에서
#    실행하게 됩니다(=임의 코드 실행 + API 키 탈취). 이 저장소는 public이라 실제 위험입니다.
#    외부 기여자 PR은 ci.yml 결과로 판단하세요.
#
# ⚠️ 시크릿은 write 권한자 전원이 꺼낼 수 있습니다(워크플로를 고쳐 값을 인코딩해 출력하면 됩니다).
#    그래서 개인 구독 OAuth 토큰(CLAUDE_CODE_OAUTH_TOKEN)이 아니라 **조직 소유 API 키**를 씁니다 —
#    유출 시 그 키만 폐기하면 되고, 개인 계정이나 팀원의 작업 쿼터에 영향이 없습니다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  # 같은 PR에 새 push가 오면 진행 중인 리뷰를 취소 — 중복 과금 방지.
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

# 리뷰에 필요한 최소 권한. 공식 예시에서 `contents: write` / `issues: write`를 뺀 이유는
# 이 워크플로가 **리뷰만** 하고 코드를 고치거나 이슈를 만들지 않기 때문입니다.
# ⚠️ `id-token: write`는 빼면 안 됩니다 — 액션이 OIDC 토큰을 발급받지 못해
#    "Could not fetch an OIDC token" 으로 실패합니다(실측: 이 권한 없이 exit code 1).
permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC 토큰 발급 — 없으면 액션이 시작조차 못 합니다
  actions: read # PR의 CI 결과를 읽어 리뷰 맥락에 반영

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    # fork PR에서는 시크릿이 주입되지 않아 인증이 실패합니다. draft PR은 리뷰하지 않습니다
    # (ready_for_review 이벤트로 초안 해제 시점에 한 번 돕니다).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # 리뷰 대상 diff를 계산하려면 base 브랜치까지 필요합니다.
          fetch-depth: 0

      # 키가 없으면 실패가 아니라 스킵 — 키 등록 전까지 팀이 빨간 X를 보지 않게 합니다
      # (SonarQube 워크플로와 같은 처리).
      - name: API 키 등록 여부 확인
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY 미등록 — AI 리뷰를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude 리뷰
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # 공식 code-review 플러그인을 씁니다. 직접 쓴 프롬프트로는 Claude가 분석 결과를
          # stdout에만 쓰고 끝나 PR에 아무것도 남지 않았습니다(실측: 34초 4턴 성공, 게시 0건).
          # 이 플러그인이 인라인 코멘트 게시와 심각도 분류를 담당합니다.
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # ⚠️ 프로젝트 고유 리뷰 기준은 여기가 아니라 AGENTS.md 에 씁니다.
          #    액션이 CLAUDE.md 를 main 기준으로 복원해 읽고(PR head는 신뢰하지 않음),
          #    CLAUDE.md 가 @AGENTS.md 를 임포트합니다. 규칙을 추가할 곳은 AGENTS.md 입니다.
          #
          # effort는 적응형 추론의 깊이(=토큰 지출)를 조절합니다. Sonnet 5의 기본값은 high이고
          # low / medium / high / xhigh / max 를 지원합니다.
          #
          # medium을 고른 이유는 비용보다 **오탐 억제** 쪽입니다. 낮은 effort일수록 확신이 큰
          # 지적만 올라오고, 높은 effort는 그물을 넓게 던져 확신이 낮은 지적까지 포함시킵니다.
          # 이 저장소의 실패 모드는 "봇이 버그를 놓치는 것"보다 "지적이 많아 팀이 봇 코멘트를
          # 통째로 무시하기 시작하는 것"입니다.
          #
          # ⚠️ --max-turns 는 걸지 않습니다. 이 플러그인은 여러 에이전트가 병렬로 분석한 뒤
          #    검증 단계를 거치는 구조라, 턴 상한이 낮으면 게시 전에 잘립니다.
          claude_args: |
            --model claude-sonnet-5
            --effort medium
