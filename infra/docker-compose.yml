# infra/docker-compose.yml — 전체 스택을 한 명령으로 기동합니다.
#
#   cp infra/.env.example infra/.env      # 값 채우기 (커밋 금지)
#   docker compose -f infra/docker-compose.yml up --build
#   curl -X POST localhost/v1/ask -H 'content-type: application/json' \
#        -d '{"question":"환불은 어떻게 하나요?"}'
#
# ⚠️ **밖에서 닿는 포트는 caddy 의 것 둘(80, 443)뿐입니다** (ADR-0016). frontend 80 은 발행을
#    멈췄고 backend 8000 은 **루프백에만** 남습니다 - 브라우저도 밖에서 오는 `curl` 도 프록시를
#    거칩니다. 루프백의 8000 은 VM 에서 `ssh -L 8000:localhost:8000` 으로 쓰는 디버깅 경로이며,
#    `/docs` 처럼 프록시가 넘기지 않는 것을 볼 때 필요합니다.
#
# 로컬과 배포가 **같은 파일**을 쓰는 것이 목적입니다 — 로컬 전용 편의를 여기 넣지 말고
# 필요하면 compose override 파일로 분리하세요.
#
# ⚠️ **override 파일을 새로 만들면 `.github/workflows/docker-build.yml` 의
#    "ai-engine이 루프백에만 묶여 있는지 확인" 스텝의 `-f` 목록에 함께 넣으세요.**
#    그 검사는 `-f` 로 지정한 파일만 읽습니다. override 가 ai-engine 의 포트를 다시 열면
#    실제로는 8100 이 인터넷에 노출되는데 CI 는 초록으로 남습니다 (infra/README.md
#    "방화벽은 우리 통제 밖입니다"). 빠뜨리면 그 스텝이 먼저 실패하도록 해 두었습니다.

name: adgen

services:
  ai-engine:
    # 독립 배포 단위 — 자체 Dockerfile로 빌드합니다(AGENTS.md 레포 구조 규약).
    # ⚠️ context를 레포 루트로 넓히지 마세요. 그 순간 이 앱이 backend 소스를 참조할 수
    #    있게 되어 "독립 배포 가능" 성질이 사라집니다.
    build:
      context: ../apps/ai-engine
    image: adgen-ai-engine:dev
    environment:
      # ⚠️ 이 스위치 하나가 스텁과 실물을 가릅니다 (구현_범위 1.1절). 기본값이 `stub` 인
      #    이유는 켜 두는 쪽이 위험하기 때문입니다 - 키가 있으면 요청마다 요금이 나갑니다.
      #    실물로 돌릴 때는 `model` 로 두고 아래 키를 반드시 함께 채우세요. 키 없이 `model`
      #    이면 렌더가 503 으로 명시적으로 실패합니다(스텁으로 되돌아가지 않습니다).
      ADGEN_GENERATION_MODE: ${ADGEN_GENERATION_MODE:-stub}
      # ⚠️ 유료 키입니다. **backend 에는 넣지 마세요** - 8000 을 외부에 여는 쪽에 키를 함께
      #    두지 않는 것이 두 앱을 나눈 이유 중 하나입니다.
      ADGEN_MODEL_API_KEY: ${ADGEN_MODEL_API_KEY:-}
      # 검증 1순위가 실제로 통과시킨 모델입니다 (2026-08-14).
      ADGEN_IMAGE_MODEL: ${ADGEN_IMAGE_MODEL:-gpt-image-2}
      # 개발용 강제 override 입니다. **비워 두는 것이 정상**이고, 그때 티어는 요청이
      #    정합니다 (계약 ImageQuality, 만화형 medium / 단일 광고형 low). 채우면 요청 값을
      #    덮어쓰고 경고 로그를 남깁니다 - 개발과 검증 실험을 low 로 돌릴 때만 쓰세요.
      ADGEN_IMAGE_QUALITY_OVERRIDE: ${ADGEN_IMAGE_QUALITY_OVERRIDE:-}
      # 한 장에 54 ~ 122초 (2026-08-14 실측). 기다리는 쪽은 사용자가 아니라 잡 워커입니다.
      ADGEN_IMAGE_TIMEOUT_S: ${ADGEN_IMAGE_TIMEOUT_S:-300.0}
    ports:
      # ⚠️ 배포에서는 이 포트를 외부에 열지 마세요. 내부 계약 경로(/v1/generate)는 인증이
      #    없습니다. 로컬 디버깅 편의로만 노출합니다.
      - "127.0.0.1:8100:8100"
    healthcheck:
      # 이미지에 curl이 없으므로(slim) 파이썬 표준 라이브러리로 검사합니다.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ../apps/backend
    image: adgen-backend:dev
    environment:
      # 컨테이너 간 통신은 서비스명으로 합니다(localhost가 아님).
      ADGEN_AI_ENGINE_URL: http://ai-engine:8100
      ADGEN_AI_ENGINE_TIMEOUT_S: ${ADGEN_AI_ENGINE_TIMEOUT_S:-8.0}
      # ── 인증 (S0) ─────────────────────────────────────────────────────────
      # ⚠️ ADGEN_ACCOUNTS 의 argon2 해시에는 `$`가 들어갑니다. compose 는 .env 값 안의
      #    `$`를 **변수 참조로 해석**하므로 `.env` 에서 `$$` 로 이스케이프해야 합니다.
      #    안 하면 해시가 조용히 뭉개진 채 전달되고 증상은 "로그인만 안 됨"으로 나옵니다
      #    (실측: README "환경변수 값에 `$`가 들어갈 때"). 뭉개진 값은 backend 가 기동
      #    시점에 거부하므로 조용히 넘어가지는 않습니다.
      # ⚠️ 모델 API 키는 여기 넣지 마세요. ai-engine 전용이며, 8000 을 외부에 여는 쪽에
      #    유료 키를 함께 두지 않는 것이 이 분리의 목적입니다.
      ADGEN_SESSION_SECRET: ${ADGEN_SESSION_SECRET:-}
      ADGEN_SESSION_MAX_AGE_S: ${ADGEN_SESSION_MAX_AGE_S:-86400}
      ADGEN_ACCOUNTS: ${ADGEN_ACCOUNTS:-}
      # ── 상태 저장소 (ADR-0010, ADR-0014) ──────────────────────────────────
      # 이미지가 이미 같은 값을 `ENV` 로 갖고 있습니다(apps/backend/Dockerfile). 여기 한 번
      # 더 적는 것은 운영자가 값을 바꿀 자리를 compose 파일 안에 두기 위해서입니다 —
      # 이 줄을 지워도 스택은 뜹니다. 코드 기본값(`./data/...`)으로 떨어지면 /app 이
      # root 소유라 비루트 앱이 죽는데, 그것을 막는 것은 이 줄이 아니라 Dockerfile 쪽입니다.
      ADGEN_DB_PATH: ${ADGEN_DB_PATH:-/data/adgen.sqlite}
      # 업로드 사진과 결과 이미지. 같은 볼륨 아래에 둡니다 - 보존 기간 정리 배치가 한 곳만
      # 보면 되도록(세션_보관_정책 2절), 그리고 백업 대상이 둘로 늘지 않도록(ADR-0014).
      ADGEN_IMAGE_DIR: ${ADGEN_IMAGE_DIR:-/data/images}
      # ── 카탈로그 ──────────────────────────────────────────────────────────
      # ⚠️ 이 줄이 없으면 **화풍을 설정으로 받는다는 설계가 배포에서 성립하지 않습니다.**
      #    후보 목록을 코드에 박지 않은 것은 미결정 대장 A절 3번이 차단이기 때문인데
      #    (backend/src/api/routes/catalog.py), compose 가 값을 전달하지 않으면 결정이
      #    내려져도 넣을 자리가 없어 화풍 선택 화면이 영원히 빈 목록입니다.
      #    JSON 배열이며 `ArtStyle` 과 같은 모양입니다.
      ADGEN_ART_STYLES: ${ADGEN_ART_STYLES:-}
      # ── 생성 타임아웃 ─────────────────────────────────────────────────────
      # 앞의 둘은 사용자가 기다리는 호출이고, 렌더는 잡 워커가 기다립니다 - 분 단위가
      # 허용되는 이유가 그것뿐입니다 (ADR-0015, API_계약.md 2.1절).
      ADGEN_BRIEF_FILL_TIMEOUT_S: ${ADGEN_BRIEF_FILL_TIMEOUT_S:-15.0}
      ADGEN_DRAFT_TIMEOUT_S: ${ADGEN_DRAFT_TIMEOUT_S:-60.0}
      ADGEN_RENDER_TIMEOUT_S: ${ADGEN_RENDER_TIMEOUT_S:-300.0}
      # ── 렌더 워커 (ADR-0015) ──────────────────────────────────────────────
      # ⚠️ 끄면 finalize 는 계속 202 를 돌려주는데 아무것도 실행되지 않습니다. 화면에는
      #    영원히 도는 스피너로 보이므로, 배포에서 이 값을 false 로 두지 마세요.
      ADGEN_WORKER_ENABLED: ${ADGEN_WORKER_ENABLED:-true}
      ADGEN_WORKER_POLL_INTERVAL_S: ${ADGEN_WORKER_POLL_INTERVAL_S:-1.0}
      # 클라이언트에게 `Retry-After` 로 알려 주는 값. 위의 워커 주기와 다릅니다 - 이쪽은
      # 네트워크 너머의 폴링이고, 저쪽은 같은 파일을 보는 폴링입니다.
      ADGEN_JOB_POLL_INTERVAL_S: ${ADGEN_JOB_POLL_INTERVAL_S:-3}
    volumes:
      # ⚠️ 이 볼륨이 없으면 컨테이너를 내릴 때 계정과 세션이 사라집니다. ADR-0010 이
      #    인메모리를 배제한 이유("확정을 눌렀는데 결과가 없다")가 그대로 재현됩니다.
      - adgen-state:/data
    ports:
      # ⚠️ **`127.0.0.1:` 이 빠지면 인터넷에 공개됩니다** (ADR-0016). 이 VM 의 8000 은 우리가
      #    만들지 않은 태그 없는 방화벽 규칙으로 **이미 열려 있어서**
      #    (infra/README.md "방화벽은 우리 통제 밖입니다"), 전 인터페이스에 바인딩하는 순간
      #    로그인 비밀번호를 평문으로 받는 문이 프록시 옆에 생깁니다 (ADR-0008).
      #    ai-engine 의 8100 과 같은 패턴이고 같은 이유입니다.
      # 루프백에는 남겨 두는 이유는 디버깅 경로 때문입니다. 프록시가 넘기는 접두어는 `/v1`
      # 과 `/health` 뿐이라 `/docs` 는 프록시로 오지 않고, "프록시가 문제인가 앱이 문제인가"
      # 를 가르려면 앱을 직접 두드릴 수 있어야 합니다. VM 에서는 `ssh -L 8000:localhost:8000`
      # 으로 닿습니다. 발행 자체를 지우면 그 포워딩도 붙을 데가 없어집니다.
      - "127.0.0.1:8000:8000"
    depends_on:
      # ⚠️ 일부러 `condition: service_healthy`를 쓰지 않습니다.
      #    backend는 ai-engine이 죽어 있어도 떠서 폴백으로 응답해야 합니다. 기동을 묶으면
      #    "엔진이 죽으면 서비스도 안 뜬다"는 정반대 성질이 생깁니다.
      - ai-engine
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  frontend:
    # 정적 번들 + `/v1` 프록시. 브라우저가 보는 유일한 출처입니다.
    # ⚠️ context 를 레포 루트로 넓히지 마세요 — 다른 앱과 마찬가지로 이 앱도 자기 디렉토리만
    #    봅니다.
    build:
      context: ../apps/frontend
    image: adgen-frontend:dev
    # ⚠️ 2026-08-19 부터 **호스트에 발행하지 않습니다** (ADR-0016). 브라우저가 보는 출처는
    #    앞의 caddy 하나이고 이 컨테이너는 그 뒤에 있습니다. 한 출처라는 성질은 그대로이며
    #    (`/v1` 은 여전히 이 안에서 backend 로 넘어갑니다), 그것이 세션 쿠키
    #    (`Secure` + `SameSite=Lax`, ADR-0013)가 실리는 조건입니다.
    #    여기에 `ports:` 를 되살리면 HTTPS 를 우회하는 평문 출처가 하나 더 생깁니다.
    depends_on:
      # ⚠️ `condition: service_healthy` 를 쓰지 않습니다. backend 가 아직 안 떴어도
      #    로그인 화면은 떠야 하고, 그때 사용자가 보는 것은 502 가 아니라 "서버에
      #    연결하지 못했습니다" 입니다 (features/auth/LoginPage.tsx).
      - backend
    healthcheck:
      # ⚠️ `127.0.0.1` 이고 `localhost` 가 아닙니다. 이 이미지 안에서 `localhost` 는 `::1`
      #    로 먼저 풀리는데 nginx 는 IPv4 만 듣고 있어 **연결 거부**가 납니다. 컨테이너는
      #    멀쩡히 서빙하는데 헬스체크만 실패하고, compose 의 `--wait` 가 거기서 멈춥니다
      #    (실측: CI 의 종단 관통 테스트가 `container adgen-frontend-1 is unhealthy` 로
      #    죽었습니다. 밖에서 보내는 요청은 전부 정상이라 증상이 서비스 장애로 안 보입니다).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  caddy:
    # HTTPS 종단 지점 (ADR-0016). **브라우저가 보는 유일한 출처입니다.**
    # 여기서 TLS 를 벗긴 평문이 frontend 로 가고, `/v1` 은 거기서 backend 로 갑니다.
    image: caddy:2.10-alpine
    environment:
      # ⚠️ **이 값 하나가 평문과 HTTPS 를 가릅니다.**
      #    비어 있으면 `:80` 으로 떨어져 평문으로 뜹니다 - 로컬과 CI 가 그 상태이고,
      #    브라우저는 `http://localhost` 를 신뢰할 수 있는 출처로 취급하므로 `Secure`
      #    쿠키도 저장됩니다 (API_계약.md 8.3절).
      #    호스트명을 넣으면 Caddy 가 그 이름으로 인증서를 자동 발급하고 HTTPS 를 켭니다.
      # ⚠️ **값을 이 파일에 적지 마세요.** `<외부 IP>.sslip.io` 형태라 그 문자열 자체가
      #    외부 IP 이고, 저장소는 public 입니다 (GCP_VM_사용_가이드.md 2-b절).
      #    값은 `infra/.env`, 이름만 `.env.example`.
      # 기본값을 여기서 한 번 더 채우는 것은 Caddyfile 의 `{$ADGEN_PUBLIC_HOST::80}` 이
      # 빈 문자열을 어떻게 다루는지에 기대지 않기 위해서입니다 - compose 의 `:-` 는
      # 미설정과 빈 값을 똑같이 다루는 것이 명세입니다.
      ADGEN_PUBLIC_HOST: ${ADGEN_PUBLIC_HOST:-:80}
    ports:
      # ⚠️ **80 을 닫지 마세요.** HTTPS 를 켜면 리다이렉트만 하는 것처럼 보이지만, 주소를
      #    그냥 친 사람이 닿는 곳이고 **인증서 발급의 HTTP-01 폴백 경로**이기도 합니다.
      #    2026-08-19 첫 발급은 `tls-alpn-01`(443)로 끝나 80 이 필수는 아니었지만, 그 경로가
      #    막히면 남는 것이 이쪽뿐입니다.
      - "80:80"
      # 443/udp(HTTP/3)는 일부러 발행하지 않습니다. 방화벽 규칙이 하나 더 필요한데 얻는
      #    것은 지연 시간 일부뿐이기 때문입니다.
      # ⚠️ 폴백이 되니 괜찮다는 뜻이 아닙니다. 발행하지 않는 것만으로는 **광고가 남아**
      #    브라우저가 QUIC 을 한 번 시도했다가 UDP 가 버려진 뒤 TCP 로 내려옵니다.
      #    그래서 광고 자체를 끕니다 - `infra/Caddyfile` 의 `protocols h1 h2`.
      #    한쪽만 되돌리면 그 지연이 돌아옵니다 (PR #126 리뷰, 신호정).
      - "443:443"
    volumes:
      # Caddyfile 은 읽기 전용으로 넣습니다 - 컨테이너가 고쳐 쓸 파일이 아닙니다.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ⚠️ 발급받은 인증서와 ACME 계정 키가 여기 있습니다. **이 볼륨이 없으면 컨테이너를
      #    올릴 때마다 재발급을 시도해 발급 한도를 먹습니다** (ADR-0016 "어려워지는 것").
      #    `/config` 는 자동 저장된 설정일 뿐이라 붙이지 않습니다 - 잃어도 Caddyfile 에서
      #    다시 만들어집니다.
      - adgen-caddy-data:/data
    depends_on:
      # ⚠️ `condition: service_healthy` 를 쓰지 않습니다. 뒤가 아직 안 떴어도 프록시는
      #    떠 있어야 합니다 - 인증서 발급은 기동 직후에 일어나고, 그때 검증 요청에 답하는
      #    것은 이 컨테이너뿐입니다.
      - frontend
    healthcheck:
      # ⚠️ 80 이 아니라 2020 을 두드립니다. HTTPS 가 켜지면 80 은 공개 주소로 리다이렉트라
      #    검사가 DNS 와 방화벽까지 재게 되고, 프록시는 멀쩡한데 검사만 실패합니다.
      #    2020 은 Caddyfile 의 헬스체크 전용 사이트이며 발행하지 않았습니다 (infra/Caddyfile).
      # ⚠️ `localhost` 가 아니라 `127.0.0.1` 입니다 - frontend 헬스체크와 같은 이유입니다.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:2020/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  # 상태 저장소(SQLite 파일)와 앞으로 들어올 이미지 파일이 사는 곳. 이름 있는 볼륨을
  # 쓰는 이유와 바인드 마운트를 택하지 않은 이유: ADR-0014.
  adgen-state:
  # 발급받은 인증서와 ACME 계정 키. `adgen-state` 와 섞지 않은 것은 보존 기간과 백업 대상이
  # 다르기 때문입니다 - 이쪽은 백업 대상이 아니고(다시 받으면 됩니다) 정리 배치의 대상도
  # 아닙니다. ⚠️ `docker compose down -v` 는 이 볼륨도 함께 지웁니다.
  adgen-caddy-data:

