# .github/workflows/frontend-ci.yml
name: Frontend CI
# ⚠️ paths 필터가 걸린 워크플로이므로 required status check로 지정하지 마세요.
#    (apps/frontend 변경이 없는 PR에서는 체크가 생성되지 않아 머지가 영구 블록됩니다 —
#     docs/공통_가이드/저장소_운영.md §4의 알려진 함정. 파이썬 앱 CI만 required입니다.)
#
# pnpm lockfile 기준으로 재현 설치하며 lint/typecheck/build를 모두 필수 실행합니다.
on:
  pull_request:
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: '11.19.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # ⚠️ 빌드보다 **먼저** 돕니다. 여기서 잡는 것은 타입도 문법도 맞는데 순서만 틀린
      #    상태 전환이라 lint/typecheck/build 가 전부 통과한 뒤에도 깨져 있을 수 있습니다.
      #    실패를 늦게 알수록 원인 후보가 늘어납니다.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
