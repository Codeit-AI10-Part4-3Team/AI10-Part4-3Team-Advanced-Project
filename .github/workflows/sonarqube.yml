# .github/workflows/sonarqube.yml
name: SonarQube Cloud

# 정적 분석 + 커버리지를 SonarQube Cloud로 보냅니다. 설정은 레포 루트 sonar-project.properties.
#
# ⚠️ required status check로 지정하지 마세요 (scripts/setup-github.sh contexts 미포함).
#    SONAR_TOKEN 미설정, Sonar 서비스 장애, fork PR 어느 경우에도 체크가 생성되지 않거나
#    실패하는데, 그때마다 머지가 영구 블록됩니다. 품질 게이트는 ci.yml이 담당합니다.
#
# ⚠️ SONAR_TOKEN이 없으면 잡 전체를 건너뜁니다 — 템플릿을 그대로 클론한 팀이 Sonar를
#    붙이기 전까지 모든 PR에서 빨간 X를 보지 않게 하기 위함입니다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    # fork PR에는 시크릿이 주입되지 않습니다(설계상). 조건에서 걸러 실패 대신 스킵합니다.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # ⚠️ 0 필수. Sonar가 blame 정보로 "새 코드(New Code)"를 판정하므로
          #    얕은 클론이면 모든 줄이 새 코드로 잡혀 Quality Gate 결과가 무의미해집니다.
          fetch-depth: 0

      - name: SONAR_TOKEN 확인
        id: guard
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "SONAR_TOKEN 시크릿이 없습니다 - Sonar 분석을 건너뜁니다."
            echo "sonar-project.properties 상단의 사전 준비 절차를 따르세요."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install apps
        if: steps.guard.outputs.enabled == 'true'
        run: pip install -e "./apps/backend[dev]" -e "./apps/ai-engine[dev]"

      # ⚠️ 커버리지 XML은 반드시 레포 루트에 만듭니다 (sonar.python.coverage.reportPaths와 일치).
      #    pytest는 앱 디렉토리를 cwd로 실행해야 그 앱의 [tool.pytest.ini_options]를 집으므로
      #    --cov-report=xml:<절대경로> 로 출력 위치만 루트로 돌립니다.
      #    coverage.py가 XML의 <sources>에 절대경로를 적고, 스캐너가 같은 러너에서 돌기 때문에
      #    경로 해석이 맞아떨어집니다 (러너를 나누면 이 전제가 깨집니다).
      #
      #    `|| true`: 테스트 실패로 리포트가 유실되면 커버리지가 0%로 보고돼 Sonar 지표가
      #    실제보다 나쁘게 왜곡됩니다. 테스트의 성패 판정은 ci.yml의 test 잡 책임입니다.
      - name: Coverage (backend)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/backend
        run: pytest --cov=src --cov-report=xml:"${GITHUB_WORKSPACE}/coverage-backend.xml" || true

      - name: Coverage (ai-engine)
        if: steps.guard.outputs.enabled == 'true'
        working-directory: apps/ai-engine
        run: pytest --cov=src --cov-report=xml:"${GITHUB_WORKSPACE}/coverage-ai-engine.xml" || true

      # 프론트엔드 커버리지는 스캐폴딩 후 별도 스텝으로 추가하고
      # sonar-project.properties에 sonar.javascript.lcov.reportPaths 를 함께 넣으세요.

      - name: SonarQube Scan
        if: steps.guard.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Quality Gate 결과를 기다립니다. required check가 아니므로 실패해도 머지는 막지 않고,
      # PR의 Sonar 코멘트/체크에서 확인하는 용도입니다.
      # ⚠️ 이 스텝이 동작하려면 Sonar 프로젝트에 웹훅이 설정돼 있어야 합니다. GitHub에서
      #    임포트한 프로젝트는 보통 자동 설정되지만, 없으면 5분 타임아웃 후 실패합니다.
      - name: Quality Gate
        if: steps.guard.outputs.enabled == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
