# .github/workflows/docker-build.yml
name: Docker Build
# ⚠️ paths 필터가 걸린 워크플로이므로 required status check로 지정하지 마세요.
#    (해당 경로 변경이 없는 PR에서는 체크가 생성되지 않아 머지가 영구 블록됩니다.)
#
# 존재 이유: apps/ai-engine의 "독립 배포 가능한 모듈" 속성은 심사 대상 산출물입니다
# (AGENTS.md 레포 구조 규약 · ADR-0001). Dockerfile이 깨진 채 머지되면 그 속성이
# 조용히 사라지므로, 이미지 빌드 + 기동 + /health 응답까지를 회귀 검사합니다.
#
# ⚠️ 빌드 컨텍스트는 앱 디렉토리입니다. 컨텍스트를 레포 루트로 넓히면 ai-engine이
#    backend 소스를 참조할 수 있게 되어 앱 간 독립성 규약이 무너집니다.
on:
  pull_request:
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/pyproject.toml'
      - 'apps/*/src/**'
      - 'infra/**'
      - '.github/workflows/docker-build.yml'
  push:
    branches: [main]
    paths:
      - 'apps/*/Dockerfile'
      - 'apps/*/src/**'
      - 'infra/**'

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Image build & smoke (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ai-engine
            port: 8100
          # backend는 아직 Dockerfile이 없어 전 단계가 건너뛰어집니다.
          # Dockerfile을 추가하면 별도 설정 없이 자동으로 검사 대상이 됩니다.
          - app: backend
            port: 8000
    steps:
      - uses: actions/checkout@v7

      - name: Skip notice (Dockerfile 없음)
        if: hashFiles(format('apps/{0}/Dockerfile', matrix.app)) == ''
        run: echo "apps/${{ matrix.app }}/Dockerfile이 아직 없습니다 — 건너뜁니다."

      - name: Build image
        if: hashFiles(format('apps/{0}/Dockerfile', matrix.app)) != ''
        run: docker build -t "adgen-${{ matrix.app }}:ci" "apps/${{ matrix.app }}"

      # 빌드만으로는 "배포 가능"이 증명되지 않습니다 — 실제로 떠서 응답하는지까지 확인합니다.
      - name: Smoke test (/health)
        if: hashFiles(format('apps/{0}/Dockerfile', matrix.app)) != ''
        run: |
          docker run -d --name "smoke-${{ matrix.app }}" \
            -p ${{ matrix.port }}:${{ matrix.port }} "adgen-${{ matrix.app }}:ci"
          # 기동 대기 — 최대 30초. 실패 시 컨테이너 로그를 남겨야 원인 파악이 가능하다.
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${{ matrix.port }}/health" > /dev/null; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::/health 응답 실패 — 컨테이너 로그:"
          docker logs "smoke-${{ matrix.app }}"
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f "smoke-${{ matrix.app }}" 2>/dev/null || true

  # infra/docker-compose.yml이 없는 단계에서도 안전하게 통과하고, 파일이 생기면 자동 활성화됩니다.
  # "docker-compose up으로 서비스가 뜬다"의 최소 회귀 검사입니다.
  compose:
    name: docker-compose config 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Skip notice (compose 파일 없음)
        if: hashFiles('infra/docker-compose.yml') == ''
        run: echo "infra/docker-compose.yml이 아직 없습니다 — 건너뜁니다."

      # config -q 는 변수 치환·서비스 정의를 실제로 해석하므로 오타/미정의 참조를 잡습니다.
      # 실제 기동(up)은 외부 API 키가 필요해 CI 범위 밖입니다.
      - name: Validate compose file
        if: hashFiles('infra/docker-compose.yml') != ''
        run: |
          cp infra/.env.example infra/.env 2>/dev/null || true
          docker compose -f infra/docker-compose.yml config -q

      # ai-engine의 내부 계약 경로(/v1/generate)에는 인증이 없습니다. VPC가 학원의 공용
      # default 네트워크라 태그 없는 방화벽 규칙이 우리 VM에도 걸리고, 우리는 그 규칙을
      # 늘리지도 막지도 못합니다 (infra/README.md "방화벽은 우리 통제 밖입니다",
      # docs/adr/0011). 따라서 `127.0.0.1:` 바인딩이 우리 손에 있는 유일한 방어선이고,
      # 그것을 지우는 한 줄짜리 변경은 diff에서 눈에 잘 띄지 않습니다.
      #
      # ⚠️ 이 워크플로는 paths 필터가 걸려 required로 지정할 수 없습니다(파일 상단).
      #    즉 이 검사는 **막는 것이 아니라 빨간 X를 남기는 것**입니다. 리뷰를 대체하지
      #    않고, 리뷰어가 놓쳤을 때 눈에 띄게 하는 장치입니다.
      #
      # 파싱 대상이 원본 YAML이 아니라 `config` 출력인 이유: 변수 치환이 끝난 최종값을
      # 봐야 `${BIND:-0.0.0.0}:8100:8100` 같은 우회가 잡힙니다.
      - name: ai-engine이 루프백에만 묶여 있는지 확인
        if: hashFiles('infra/docker-compose.yml') != ''
        run: |
          # Actions 의 기본 셸에 이미 -e 가 걸려 있지만 명시합니다 — 이 블록을 로컬에서
          # 그대로 돌려 볼 때 `config` 실패가 빈 JSON 파싱 오류로 둔갑하지 않도록.
          set -euo pipefail

          # 파일로 받는 이유: heredoc 스크립트가 stdin을 쓰므로 JSON을 파이프로 함께
          # 넘길 수 없습니다. 작업 트리 밖에 두는 이유: 이 스텝을 로컬에서 그대로 돌려
          # 보는 사람의 `git status`를 더럽히지 않기 위해서입니다.
          config_json="${RUNNER_TEMP:-/tmp}/compose-config.json"
          docker compose -f infra/docker-compose.yml config --format json > "$config_json"
          CONFIG_JSON="$config_json" python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          # 이 검사는 -f 로 지정한 파일 하나만 봅니다. compose 파일이 더 있으면 실제로
          # 뜨는 구성과 검사 대상이 갈라져, 오버라이드에서 포트를 다시 열어도 초록입니다.
          # 오버라이드를 처음 만드는 PR 이 위 `-f` 목록을 함께 늘리도록 여기서 막습니다
          # (사람이 기억하기를 기대하는 순간 이 검사의 존재 이유가 없어집니다).
          checked = Path("infra/docker-compose.yml")
          others = sorted(p for p in Path("infra").glob("*compose*.y*ml") if p != checked)
          if others:
              sys.exit(
                  f"검사하지 않는 compose 파일이 있습니다: {[str(p) for p in others]}\n"
                  "  이 스텝의 `docker compose -f ...` 목록에 함께 넣으세요. 넣지 않으면\n"
                  "  오버라이드가 포트를 다시 열어도 이 검사는 통과합니다."
              )

          services = json.loads(Path(os.environ["CONFIG_JSON"]).read_text())["services"]
          if "ai-engine" not in services:
              # 서비스 이름이 바뀌면 이 검사는 아무것도 보지 않으면서 계속 초록입니다.
              # 통과하지 않는 편이 낫습니다 — 조용히 비어버린 검사가 검사 없음보다 나쁩니다.
              sys.exit("compose에 ai-engine 서비스가 없습니다. 이름을 바꿨다면 이 검사도 함께 고치세요.")

          if services["ai-engine"].get("network_mode") == "host":
              # host 모드에서는 ports 가 무시되고 컨테이너가 호스트 인터페이스에 그대로
              # 붙습니다. `127.0.0.1:8100:8100` 줄은 남아 있으므로 아래 검사만으로는
              # 초록이 되고, 실제로는 8100 이 인터넷에 열립니다.
              sys.exit(
                  "ai-engine이 host 네트워크 모드입니다. ports의 127.0.0.1 바인딩이 무시됩니다.\n"
                  "  고치는 법: network_mode: host 를 지우고 ports 로만 노출하세요."
              )

          # ports 자체가 없으면 호스트에 발행되지 않은 것이므로 가장 안전한 상태입니다.
          # 발행된 경우에만 host_ip를 봅니다 — 바인딩을 지정하지 않으면 이 키가 아예
          # 없으므로(= 전 인터페이스), `!= 127.0.0.1` 비교가 그대로 잡아냅니다.
          exposed = [p for p in services["ai-engine"].get("ports") or [] if p.get("host_ip") != "127.0.0.1"]
          if exposed:
              sys.exit(
                  f"ai-engine 포트가 루프백 밖에 열려 있습니다: {exposed}\n"
                  '  고치는 법: infra/docker-compose.yml의 ports를 "127.0.0.1:8100:8100" 형태로 되돌리세요.\n'
                  "  이유: infra/README.md \"방화벽은 우리 통제 밖입니다\" / docs/adr/0011-배포_환경_스펙과_권한_경계.md"
              )
          PY
