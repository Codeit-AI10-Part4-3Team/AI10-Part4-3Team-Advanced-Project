# SonarQube Cloud (구 SonarCloud) 분석 설정 — .github/workflows/sonarqube.yml 이 읽습니다.
#
# 사전 준비 (사람이 1회 수행, 자동화 불가):
#   1) https://sonarcloud.io 에서 GitHub 계정으로 로그인 -> 조직 임포트 -> 이 레포 추가
#   2) 프로젝트 설정 > Analysis Method 에서 "Automatic Analysis"를 **끄세요**.
#      ⚠️ 켜져 있으면 아래 CI 기반 스캔이 "이미 자동 분석 중"이라며 실패합니다. 둘 중 하나만 씁니다.
#      CI 기반을 쓰는 이유: 자동 분석은 커버리지 리포트를 읽지 못합니다.
#   3) My Account > Security 에서 토큰 발급 -> 레포 Settings > Secrets 에 SONAR_TOKEN 등록
#
# ⚠️ 아래 두 키는 SonarQube Cloud 프로젝트 페이지에 표시된 값과 **정확히** 일치해야 합니다.
#    (GitHub에서 임포트하면 보통 organization=<owner 소문자>, projectKey=<owner>_<repo> 입니다.)
#    organization 키는 대문자를 허용하지 않으므로, owner에 대문자가 있으면 소문자로 고쳐 적으세요.
sonar.organization=codeit-ai10-part4-3team
sonar.projectKey=Codeit-AI10-Part4-3Team_AI10-Part4-3Team-Advanced-Project

# ── 분석 대상 ────────────────────────────────────────────────────────────────
# ⚠️ sources와 tests는 겹치면 안 됩니다(겹치면 스캐너가 에러로 중단).
#    앱을 추가하면 두 줄과 아래 coverage.reportPaths 를 함께 갱신하세요.
sonar.sources=apps/backend/src,apps/ai-engine/src,packages,scripts
sonar.tests=apps/backend/tests,apps/ai-engine/tests,apps/ai-engine/eval,e2e

# 프론트엔드는 스캐폴딩 전이라 비워둡니다. apps/frontend 생성 후 위 sources에
# apps/frontend/src 를 추가하고, node_modules/빌드 산출물은 exclusions에 넣으세요.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/*.egg-info/**,notebooks/**,**/*.ipynb

# 노트북은 분석에서 제외합니다 — 출력 셀이 stripped된 실험 기록이라 품질 지표를 왜곡합니다
# (nbstripout 규약: .pre-commit-config.yaml 참고).

# ── 언어별 설정 ──────────────────────────────────────────────────────────────
# apps/*/pyproject.toml 의 requires-python 과 싱크 유지.
sonar.python.version=3.12

# 워크플로가 레포 루트에 생성하는 파일명과 일치해야 합니다.
# ⚠️ 파일이 없으면 스캐너는 경고만 남기고 커버리지를 0%로 보고합니다 — Quality Gate가
#    "새 코드 커버리지" 조건에서 조용히 실패하는 흔한 원인입니다.
sonar.python.coverage.reportPaths=coverage-backend.xml,coverage-ai-engine.xml

sonar.sourceEncoding=UTF-8
