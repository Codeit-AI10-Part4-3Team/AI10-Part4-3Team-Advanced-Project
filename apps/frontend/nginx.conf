# 배포에서 vite 개발 서버가 하던 두 가지를 이어받습니다 (vite.config.ts).
#
#   1. `/v1` 을 backend 로 넘기는 프록시 — 브라우저가 한 출처만 보게 합니다.
#   2. SPA 폴백 — 없는 경로를 index.html 로 돌려줍니다.
#
# 둘 다 편의가 아니라 동작 조건입니다. 아래 주석에 이유를 적어 둡니다.

server {
    listen 80;
    # ⚠️ IPv6 도 함께 듣습니다. 이 이미지의 엔트리포인트(`10-listen-on-ipv6-by-default.sh`)가
    #    이 줄을 자동으로 넣어 주는데, **패키지 기본 conf 와 다르면 건너뜁니다** - 우리가
    #    그 파일을 대체했으므로 건너뜁니다. 그러면 컨테이너 안의 `localhost` 가 `::1` 로
    #    풀리는 순간 연결 거부가 나고, 밖에서 오는 요청은 전부 정상이라 증상이 서비스
    #    장애로 보이지 않습니다 (실측: 헬스체크만 실패해 CI 의 `--wait` 가 멈췄습니다).
    listen [::]:80;
    server_name _;

    # 업로드 사진이 10MB 까지 허용됩니다 (계약 `SessionCreateRequest.productImage`).
    # nginx 기본값은 1MB 라, 이 줄이 없으면 규격에 맞는 사진이 413 으로 잘립니다 —
    # 그리고 그 413 은 backend 로그에 남지 않아 백엔드를 아무리 봐도 원인이 안 보입니다.
    #
    # ⚠️ **10m 이 아니라 12m 입니다. 사진 크기가 아니라 요청 본문 크기이기 때문입니다.**
    #    `client_max_body_size` 가 재는 것은 `Content-Length` 이고, multipart 요청에는
    #    사진 말고도 경계 문자열, 파트 헤더, `productName` `sellingPoint` `note` 가 함께
    #    실립니다. 10m 으로 두면 backend 가 받아 주는 정확히 10MB 짜리 사진이 필드를
    #    최소로 채워도 873바이트, 최대로 채우면 3,446바이트 넘쳐 413 이 됩니다 (nginx
    #    1.27 실측, 2026-08-18). 계약이 허용한 마지막 3KB 가 닿을 수 없게 됩니다.
    #
    #    같은 규칙이 바로 아래 `proxy_read_timeout` 에도 적용됩니다 - 게이트웨이 상한은
    #    앱 상한보다 커야 합니다 (API_계약 2절). 이 줄만 그 규칙에서 빠져 있었습니다.
    #    여유를 2MB 로 둔 것은 사진 이후 필드가 늘어나도 다시 계산하지 않기 위해서입니다.
    client_max_body_size 12m;

    location /v1/ {
        # ⚠️ **이 프록시가 로그인의 전제입니다.** 세션 쿠키는 `Secure` + `SameSite=Lax`
        #    이고 `Secure` 는 설정으로 끌 수 없습니다 (ADR-0013, api/routes/auth.py).
        #    프론트를 backend 와 다른 출처에 두면 쿠키가 실리지 않아 모든 요청이 401 이
        #    되고, 증상은 "로그인만 안 됨" 으로 나타납니다.
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 게이트웨이 상한은 앱 상한보다 커야 합니다 (API_계약 2절). 시안 생성의 서버측
        #    상한이 60초이므로 여기서 60초에 끊으면 앱이 아직 답을 만들고 있는 요청을
        #    프록시가 먼저 포기합니다. 렌더는 잡이라 이 경로로 기다리지 않습니다.
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # 화풍 예시 8장. backend 가 볼륨(`/data/art-styles`)에서 정적으로 내줍니다.
    #
    # ⚠️ **이 블록이 없으면 아래 SPA 폴백이 먼저 잡아 `index.html` 을 돌려줍니다.** 상태
    #    코드가 200 이라 `<img>` 는 오류를 내지 않고 그냥 깨진 그림으로 보이며, 네트워크
    #    탭에서도 200 이라 원인이 프론트 버그처럼 보입니다. `/v1` 과 달리 이 경로는
    #    계약에 없어서(정적 자산) 규칙이 자동으로 따라오지 않습니다.
    #
    # ⚠️ 여기는 **인증 밖입니다.** backend 쪽 마운트가 그렇게 설계돼 있고(제품 자산이지
    #    사용자 데이터가 아닙니다), 그래서 이 블록에 쿠키 관련 설정이 없습니다.
    #    캐시 헤더는 backend 가 붙입니다(`public, max-age=3600`).
    location /static/art-styles/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # ⚠️ SPA 폴백. `BrowserRouter` 라 `/login` 은 서버에 그런 파일이 없고, 이 줄이
        #    없으면 주소창에 직접 치거나 새로고침할 때마다 404 가 뜹니다.
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 자산은 내용이 바뀌면 이름이 바뀝니다. index.html 은 그렇지 않으므로
    # 캐시하면 새 배포가 옛 번들을 계속 가리킵니다.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
