# .github/workflows/ai-review.yml
name: AI review

# LLM 기반 맥락 리뷰 — Greptile을 대체합니다(월 결제가 필요해 도입하지 않았습니다).
#
# 사전 작업 2개 — 하나만 해서는 동작하지 않습니다:
#   1. Claude GitHub App 설치 (https://github.com/apps/claude)
#      ⚠️ 없으면 `Claude Code is not installed on this repository` 로 실패합니다.
#         아래 시크릿 가드는 키만 검사하므로 이 상태를 걸러 주지 못합니다.
#   2. ANTHROPIC_API_KEY 시크릿 등록 (없으면 실패 대신 스킵)
#
# reviewdog(결정론적 린트)·SonarQube(정적 분석)와 같은 계층의 **보조 리뷰어**이고,
# 하드 게이트는 ci.yml(ruff / mypy / pytest)이 담당합니다.
#
# ⚠️ required status check로 지정하지 마세요. 아래 두 상황에서 체크가 아예 생성되지 않고,
#    그 순간 모든 PR이 영구히 "Expected" 상태로 머지 블록됩니다:
#      (1) 아래 fork 가드로 외부 기여자 PR에서는 잡이 스킵됩니다
#      (2) ANTHROPIC_API_KEY 미등록 시 스킵됩니다
#    scripts/setup-github.sh의 contexts에 넣지 않는 이유가 이것입니다
#    (reviewdog / SonarQube와 동일한 결정 — docs/공통_가이드/저장소_운영.md §8).
#
# ⚠️ pull_request_target으로 바꾸지 마세요. fork의 코드를 write 권한 + 시크릿 접근 컨텍스트에서
#    실행하게 됩니다(=임의 코드 실행 + API 키 탈취). 이 저장소는 public이라 실제 위험입니다.
#    외부 기여자 PR은 ci.yml 결과로 판단하세요.
#
# ⚠️ 시크릿은 write 권한자 전원이 꺼낼 수 있습니다(워크플로를 고쳐 값을 인코딩해 출력하면 됩니다).
#    그래서 개인 구독 OAuth 토큰(CLAUDE_CODE_OAUTH_TOKEN)이 아니라 **조직 소유 API 키**를 씁니다 —
#    유출 시 그 키만 폐기하면 되고, 개인 계정이나 팀원의 작업 쿼터에 영향이 없습니다.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  # 같은 PR에 새 push가 오면 진행 중인 리뷰를 취소 — 중복 과금 방지.
  group: ai-review-${{ github.ref }}
  cancel-in-progress: true

# 리뷰에 필요한 최소 권한. 공식 예시에서 `contents: write` / `issues: write`를 뺀 이유는
# 이 워크플로가 **리뷰만** 하고 코드를 고치거나 이슈를 만들지 않기 때문입니다.
# ⚠️ `id-token: write`는 빼면 안 됩니다 — 액션이 OIDC 토큰을 발급받지 못해
#    "Could not fetch an OIDC token" 으로 실패합니다(실측: 이 권한 없이 exit code 1).
permissions:
  contents: read
  pull-requests: write
  id-token: write # OIDC 토큰 발급 — 없으면 액션이 시작조차 못 합니다
  actions: read # PR의 CI 결과를 읽어 리뷰 맥락에 반영

jobs:
  review:
    name: AI review
    runs-on: ubuntu-latest
    # fork PR에서는 시크릿이 주입되지 않아 인증이 실패합니다. draft PR은 리뷰하지 않습니다
    # (ready_for_review 이벤트로 초안 해제 시점에 한 번 돕니다).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          # 리뷰 대상 diff를 계산하려면 base 브랜치까지 필요합니다.
          fetch-depth: 0

      # 키가 없으면 실패가 아니라 스킵 — 키 등록 전까지 팀이 빨간 X를 보지 않게 합니다
      # (SonarQube 워크플로와 같은 처리).
      - name: API 키 등록 여부 확인
        id: guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY 미등록 — AI 리뷰를 건너뜁니다."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      # ⚠️ continue-on-error: 리뷰 실패가 잡을 빨갛게 만들지 않습니다. 이유는 편의가 아니라
      #    이 저장소의 설계 원칙(열화 폴백)과 같습니다 — AI 리뷰는 보조 리뷰어이고 하드 게이트는
      #    ci.yml이므로, 크레딧 소진·API 장애로 보조 리뷰어가 죽었을 때 PR이 멈출 이유가 없습니다.
      #    반대로 **매 PR마다 붙는 빨간 X는 팀이 체크를 무시하게 만드는 쪽으로 작동**합니다.
      #    단, 조용히 실패하면 안 되므로 실패 사유는 아래 스텝이 ::warning:: 으로 남깁니다
      #    (열화한 사실이 드러나야 한다 = messageMode와 같은 성질).
      - name: Claude 리뷰
        id: review
        if: steps.guard.outputs.enabled == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # ⚠️ --allowedTools 는 **배타적 허용 목록**입니다. 여기 없는 도구는 거부됩니다.
          #    두 가지를 동시에 만족해야 합니다:
          #    (1) mcp__github_inline_comment__ 접두사 도구가 있어야 액션이 해당 MCP 서버를
          #        **설치합니다**(src/mcp/install-mcp-server.ts). 없으면 게시 수단 자체가 없습니다.
          #    (2) Read / Grep / Glob 이 있어야 코드를 읽습니다. 공식 예시에는 이 셋이 없는데,
          #        그 예시는 `gh pr diff` 만으로 끝나는 리뷰를 전제합니다. 우리 프롬프트는
          #        AGENTS.md 규약과 파일을 가로지르는 정합성을 보므로 읽기 도구가 필요합니다.
          #    실측: 셋을 빼면 permission_denials_count: 2 가 뜨고 6초 만에 포기합니다.
          #    이 줄과 아래 프롬프트의 "게시하라" 지시는 한 쌍입니다. 하나만 있으면 동작하지 않습니다.
          # 🔎 리뷰가 게시되지 않는데 원인을 모르겠다면 `show_full_output: "true"` 를 임시로
          #    켜세요(액션이 기본으로 출력을 가립니다). 진단이 끝나면 반드시 되돌리세요 —
          #    켜 둔 채로 두면 리뷰 전문이 공개 Actions 로그에 남습니다.
          # ⚠️ --max-turns 를 20 이하로 내리지 마세요. 예산을 소진하면 `error_max_turns` 로 죽는데,
          #    그때까지의 분석은 **전부 버려집니다** — API 비용은 나가고 PR에는 아무것도 남지 않으며
          #    빨간 X만 붙습니다(실측: PR #15, 20턴 소진 / 게시 0건).
          #    실측 턴 수: 파일 1개짜리 최소 PR이 16턴, 문서 2개짜리 PR이 16·16턴, 코드 PR이 5·6턴.
          #    즉 20은 **최소 PR 기준 헤드룸이 4턴**뿐이라 정상 리뷰가 상한에 닿습니다.
          #    40은 관측된 최댓값(16)의 약 2.5배이고, 비용은 턴에 대략 비례하므로 최악에도
          #    PR당 $1 아래입니다(16턴 = $0.35 실측). 근거: docs/공통_가이드/저장소_운영.md §8.
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
          # ⚠️ 스타일·포맷·타입을 지적하게 두지 마세요. ruff / mypy / reviewdog가 이미
          #    결정론적으로 판정하므로, LLM이 같은 주제로 코멘트하면 서로 충돌하는 조언이 되어
          #    사람이 어느 쪽을 따를지 잃습니다. 그 순간 팀은 봇 코멘트 전체를 무시하기 시작합니다.
          prompt: |
            이 PR을 한국어로 리뷰하세요. 저장소 규약은 AGENTS.md가 원천이고,
            리뷰 코멘트 서식은 docs/공통_가이드/코드_리뷰_가이드.md가 원천입니다.
            리뷰를 쓰기 전에 그 문서를 읽고 §2~§4의 서식을 그대로 따르세요.
            사람 리뷰어도 같은 문서를 쓰므로, 두 리뷰가 같은 서식으로 읽혀야 합니다.

            서식 요약 (문서와 어긋나면 문서가 우선):
            - 제목에 결론을 담고 처리 등급을 함께 붙입니다. 라벨은 글자 그대로:
              `머지 전 필수` / `이 PR에서 권장` / `후속 과제` / `참고, 조치 불필요`
            - 첫 문단은 코드를 열지 않고 읽혀야 합니다 — 누가·언제·어떻게 피해를 보는지,
              그리고 왜 지금은 멀쩡해 보이는지.
            - 근거 문단에서 파일과 줄을 정확히 인용합니다.
            - 수정 코드는 한 파일·몇 줄·판단이 개입하지 않을 때만 제시하고,
              `로컬에서 확인함` / `미검증, 눈으로만 확인` 중 하나를 표기합니다.
              판단이 개입하면 코드가 아니라 선택지를 제시하세요.

            반드시 지적할 것 (코드_리뷰_가이드.md §1-a와 같은 목록입니다 — 한쪽만 고치지 마세요):
            - 앱 간 경계 위반 — apps/ai-engine 이 apps/backend 를 import(역도 동일),
              training/ 과 apps/ 의 양방향 import, backend_core 가 api 를 import
            - 요청/응답 스키마를 바꾸면서 packages/contracts/openapi.yaml 을 함께 고치지 않은 변경
            - 하드코딩된 API 키·토큰·자격증명 (테스트 픽스처 포함, 최우선)
            - 예외 처리 없는 외부 호출(HTTP, 모델 API, 파일 IO). 의도적 생략이면 주석에 이유가 있어야 합니다
            - 논리 오류, 경계 조건 누락, 되돌릴 수 없는 부작용
            - 가드레일을 목으로 대체하거나 우회해 테스트를 통과시키는 변경 (측정을 무효로 만듭니다)
            - 외부 의존이 죽었을 때 조용히 실패하는 경로 — 열화 폴백이 없거나 messageMode에 드러나지 않음
            - 학습과 추론이 동시에 VRAM을 요구하는 변경, 이미지 생성을 동기 HTTP 응답으로 붙드는 변경
            - required check 이름(.github/workflows/ci.yml 의 잡 name)을 바꾸면서
              scripts/setup-github.sh 의 contexts 를 함께 고치지 않은 변경

            지적하지 말 것:
            - 스타일·포맷·import 정렬·타입 (ruff / mypy / reviewdog 소관)
            - 문서의 표현이나 오타

            ⚠️ 결과를 반드시 GitHub에 게시하세요. 응답 메시지로만 쓰면 아무에게도 전달되지 않습니다.
            - 특정 코드 줄에 대한 지적: mcp__github_inline_comment__create_inline_comment 을
              confirmed: true 로 호출해 해당 줄에 인라인 코멘트를 다세요.
            - 전체 총평 한 줄: `gh pr comment` 로 남기세요. 지적이 없으면 없다고 쓰세요.

            ⚠️ 게시하지 못하고 끝나는 것이 최악입니다. 턴 예산을 소진하면 그때까지 읽고 판단한 것이
            전부 사라지고 PR에는 아무것도 남지 않습니다. 그래서 이 리뷰에도 열화 폴백이 있습니다:
            **탐색에 턴을 절반 넘게 썼다면 더 파고들지 말고 그 시점의 결론을 게시하세요.**
            확인하지 못한 항목은 "확인 못 함"이라고 적으면 됩니다 - 불완전한 리뷰는 쓸모가 있지만
            게시되지 않은 리뷰는 없는 것과 같습니다.

            주장의 신뢰도를 라벨로 밝히세요 (코드_리뷰_가이드.md §4-a와 같은 목록입니다):
            '확실한 사실' / '높은 신뢰' / '추정' / '불확실'. 라벨이 없는 문장은 확실한 사실로
            읽히므로, 확인하지 않은 것에는 반드시 붙이세요. '추정'·'불확실' 항목에는
            처리 등급을 '머지 전 필수'로 달지 마세요 - 확인이 먼저입니다.

      # 위 스텝이 continue-on-error라 실패해도 잡은 초록입니다. 그 상태로 두면 "리뷰가 왜 안
      # 붙었는지" 아무도 모르게 되므로, 여기서 이유를 눈에 보이게 남깁니다.
      # ⚠️ outcome을 봐야 합니다 — continue-on-error가 걸린 스텝의 conclusion은 항상 success 입니다.
      # 가장 흔한 원인이 크레딧 소진(HTTP 400 credit_balance_too_low)이고, 그 다음이
      # Claude GitHub App 미설치입니다. 둘 다 코드 문제가 아니라 계정 문제라 재실행으로 낫지 않습니다.
      - name: 리뷰 실패 사유 표기
        if: steps.review.outcome == 'failure'
        run: |
          echo "::warning title=AI 리뷰 실패 (머지는 막지 않음)::AI 리뷰가 실패해 이 PR에는 리뷰 코멘트가 없습니다. 머지 판단은 required 체크(ci.yml)와 사람 리뷰로 하세요. 흔한 원인: (1) API 크레딧 소진 — 콘솔에서 잔액 확인 후 수동 충전, (2) Claude GitHub App 미설치, (3) 외부 서비스 장애. 상세 로그는 위 'Claude 리뷰' 스텝을 펼쳐 보세요."
          {
            echo "### AI 리뷰 실패"
            echo
            echo "보조 리뷰어이므로 머지는 막지 않습니다(하드 게이트는 \`ci.yml\`)."
            echo "확인 순서: API 크레딧 잔액 -> Claude GitHub App 설치 여부 -> Anthropic 서비스 상태."
            echo
            echo "근거: \`docs/공통_가이드/저장소_운영.md\` §8."
          } >> "$GITHUB_STEP_SUMMARY"
