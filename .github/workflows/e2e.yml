# .github/workflows/e2e.yml
name: E2E
# ⚠️ required status check로 지정하지 마세요 — 두 가지 이유가 모두 해당합니다.
#    ① paths 필터가 걸려 있어 해당 경로 변경이 없는 PR에서는 체크가 생성되지 않습니다.
#    ② E2E는 스택 기동과 외부 API 키에 의존하므로, required로 걸면 인프라 사정으로
#       모든 PR이 블록됩니다. 관통 검증은 "머지 차단"이 아니라 "신호" 역할입니다.
#
# 하네스 위치가 apps/* 밖인 이유는 e2e/README.md 참고 (required pytest 매트릭스가
# 이 테스트를 수집하면 안 되기 때문).
on:
  pull_request:
    paths:
      - 'e2e/**'
      - 'apps/**'
      - 'infra/**'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'apps/**'
      - 'infra/**'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: 종단 관통 테스트
    runs-on: ubuntu-latest
    # ⚠️ 기본값 6시간을 쓰지 않는 이유는 시간이 아니라 **신호**입니다. 한 단계가 걸리면
    #    그동안 체크는 계속 `pending` 이고, PR 화면에서는 "도는 중"과 "죽었음"이 구분되지
    #    않습니다. 평소 1~2분에 끝나는 잡이라 15분을 넘겼다면 그것은 느린 것이 아니라
    #    멈춘 것이고, 실패로 떨어져야 사람이 알아봅니다.
    #    실측 사고: PR #124 의 런이 `playwright install` 에서 2시간 14분 멈춰 있었고,
    #    같은 브랜치의 직전 런은 같은 단계를 포함해 1분 7초에 끝났습니다 (2026-08-19).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: e2e/requirements.txt

      - name: Install harness
        run: pip install -r e2e/requirements.txt

      # 스택 기동: infra/docker-compose.yml이 생기는 순간 자동으로 활성화됩니다.
      # 그 전까지는 E2E_BASE_URL이 비어 있어 모든 테스트가 skip → 잡은 초록입니다.
      # ⚠️ .env.example의 더미 값으로 뜨는 범위까지만 검증됩니다. 실제 외부 API 키가 필요한
      #    시나리오는 secrets 등록 후에야 통과합니다 — non-required인 이유이기도 합니다.
      - name: Start stack (compose가 있으면)
        if: hashFiles('infra/docker-compose.yml') != ''
        run: |
          cp infra/.env.example infra/.env 2>/dev/null || true
          docker compose -f infra/docker-compose.yml up -d --wait
          echo "E2E_BASE_URL=http://localhost:8000" >> "$GITHUB_ENV"

      # 브라우저 시나리오(딥링크 진입 → 위치 1회 확인)는 chromium만 설치해 잡 시간을 줄입니다.
      #
      # ⚠️ **`--with-deps`를 쓰지 않습니다.** 그 옵션은 OS 라이브러리를 apt로 깔고, apt는
      #    Ubuntu 아카이브 미러에 닿지 못하면 무한 재시도합니다 — 실패가 아니라 **정지**라
      #    잡이 타임아웃까지 매달립니다. 2026-08-19에 두 번 재현됐고 로그는 둘 다
      #    `Ign: http://azure.archive.ubuntu.com/... InRelease` 반복이었습니다.
      #    이 옵션을 빼면 Playwright CDN에서 브라우저 바이너리만 받고 apt를 아예 거치지
      #    않습니다. 러너 이미지(ubuntu-latest)에 chromium이 요구하는 공유 라이브러리가
      #    이미 들어 있어 성립하며, 아니라면 브라우저 실행 단계에서 즉시 터지므로 조용히
      #    넘어가지 않습니다.
      - name: Install browser
        run: playwright install chromium

      # ⚠️ cwd를 e2e로 두어야 e2e/pyproject.toml의 testpaths/markers를 집습니다.
      - name: Run E2E
        working-directory: e2e
        run: pytest -v

      - name: Stack logs (실패 시 원인 파악용)
        if: failure() && hashFiles('infra/docker-compose.yml') != ''
        run: docker compose -f infra/docker-compose.yml logs --no-color --tail=200

      - name: Teardown
        if: always() && hashFiles('infra/docker-compose.yml') != ''
        run: docker compose -f infra/docker-compose.yml down -v
