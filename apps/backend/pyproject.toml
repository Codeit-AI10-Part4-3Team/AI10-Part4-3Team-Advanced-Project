# apps/backend — 사용자 요청을 받아 도메인 로직을 태우고 ai-engine을 호출하는 API 서버.
# 설치: 레포 루트에서  pip install -e "./apps/backend[dev]"
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgen-backend"
version = "0.1.0"
description = "백엔드 — 요청 수신, 도메인 처리, ai-engine 호출 오케스트레이션"
requires-python = ">=3.12"

# 런타임 의존성 — "어디서나 필요한 최소 집합"만 유지할 것.
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # ai-engine 호출용 — 앱 간 결합이 HTTP 계약뿐이므로 HTTP 클라이언트가 런타임 필수입니다
    # (dev extra의 httpx는 TestClient용이라 별개 목적입니다).
    "httpx>=0.27.0",
    # 비밀번호 해시 — 세션_보관_정책.md 1.2절이 argon2 또는 bcrypt 로 범위를 정했습니다.
    # 평문·가역 암호화는 둘 다 금지이고, 이 저장소가 public 이라 예외가 없습니다.
    # 파라미터는 라이브러리 기본값을 씁니다(직접 조정하면 잘못 조정합니다 — 같은 절).
    "argon2-cffi>=23.1.0",
    # 계약의 multipart 경로(POST /v1/sessions, /v1/brief:fill)를 FastAPI 가 파싱하려면
    # 필요합니다. 없으면 라우트 정의 시점에 RuntimeError 로 죽습니다 - 런타임 의존입니다.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # SonarQube Cloud가 커버리지를 읽으려면 coverage.xml이 필요합니다
    # (.github/workflows/sonarqube.yml). 로컬에서도 같은 명령을 재현할 수 있게 dev에 둡니다.
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",          # FastAPI TestClient 백엔드
    # 계약 준수 테스트가 packages/contracts/openapi.yaml 을 직접 읽습니다. 런타임에는
    # 쓰지 않으므로 dev 전용입니다 — core 에 올리면 배포 이미지에 불필요하게 실립니다.
    "pyyaml>=6.0",
    # ⚠️ ruff는 .pre-commit-config.yaml의 rev와 **정확히 같은 버전**으로 고정합니다.
    #    범위(>=)로 두면 CI의 lint 잡은 최신 ruff를, pre-commit 잡은 rev 버전을 쓰게 돼
    #    같은 코드가 한쪽만 통과합니다. ruff는 0.x라 마이너 업그레이드에서 기본 규칙셋이
    #    넓어집니다 — 올릴 때는 네 파일(여기·ai-engine·.pre-commit-config.yaml·
    #    .github/workflows/reviewdog.yml의 RUFF_VERSION)을 같은 PR에서.
    "ruff==0.16.4",
    "mypy>=1.10.0",
]
# ── 무거운 의존성(DB 드라이버, 지오 연산 등)은 core에 넣지 말고 별도 extra로 분리할 것.
#    CI/기본 설치를 가볍게 유지하는 장치입니다. 예: pip install -e "./apps/backend[db]"
# db = ["sqlalchemy>=2.0.0", "psycopg[binary]>=3.1.0"]

# src 레이아웃: src/ 하위 패키지(api, backend_core)를 최상위 import 이름으로 노출.
# 코드는 `import backend_core` / `from api import ...` 형태 (⚠️ `src.` 접두어 없음).
[tool.setuptools.packages.find]
where = ["src"]

# ⚠️ .py가 아닌 자산(픽스처·캐시 등)은 명시하지 않으면 wheel/컨테이너 이미지에서 빠집니다.
#    editable 설치에서는 소스를 직접 가리켜 증상이 없다가 배포 이미지에서만 터집니다.
[tool.setuptools.package-data]
backend_core = ["fixtures/*.jsonl"]

# Pylance/pyright 경로 — 없으면 IDE에서 내부 import가 unresolved로 표시됨.
[tool.pyright]
extraPaths = ["src"]

# ⚠️ mypy는 이 디렉토리를 cwd로 실행해야 이 설정을 집습니다 (CI/scripts가 그렇게 호출).
[tool.mypy]
# pydantic 플러그인이 없으면 alias 를 준 필드의 생성자 인자를 alias 이름으로만 인식해,
# populate_by_name=True 로 허용된 파이썬 이름 호출이 call-arg 오류로 잡힙니다
# (SingleAdDraft.ad_copy / alias="copy" 가 그 경우). 플러그인은 그 설정을 읽습니다.
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# 점진 도입: 계약(packages/contracts)이 확정된 뒤 아래 두 줄을 켜세요.
# disallow_untyped_defs = true
# disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠️ 테스트 파일의 **basename 은 레포 안에서 유일해야 합니다.** pytest 기본 import 모드는
#    테스트를 최상위 모듈명으로 잡으므로, 서로 다른 디렉토리에 같은 이름이 둘 있으면
#    수집이 `import file mismatch`로 깨집니다. src/ 구조를 미러링하는 규약(AGENTS.md)을
#    따르다 보면 `api/routes/auth.py`와 `backend_core/models/auth.py`처럼 같은 이름이
#    생기는데, 그때는 뒤에 역할을 붙이세요(`test_auth_routes.py`).
#    `--import-mode=importlib`로 푸는 방법도 있지만 `from conftest import ...`가 함께
#    깨지므로, 그 전환은 conftest 사용처를 정리하는 별도 작업입니다.
