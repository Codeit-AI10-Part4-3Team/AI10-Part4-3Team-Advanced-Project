# apps/ai-engine — 검색(RAG) + 가드레일 기반 생성 (독립 배포 단위)
# 설치: 레포 루트에서  pip install -e "./apps/ai-engine[dev]"
#
# ⚠️ 이 앱은 backend와 "독립적으로 배포 가능"해야 합니다 (AGENTS.md의 레포 구조 규약).
#    backend를 import하지 마세요 — 통신은 packages/contracts의 HTTP 계약으로만 합니다.
[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adgen-ai-engine"
version = "0.1.0"
description = "AI 엔진 — 근거 검색과 가드레일 제약 생성"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # 계약의 multipart 경로(POST /v1/sessions, /v1/brief:fill)를 FastAPI 가 파싱하려면
    # 필요합니다. 없으면 라우트 정의 시점에 RuntimeError 로 죽습니다 - 런타임 의존입니다.
    "python-multipart>=0.0.9",
    # 무손실 WebP 인코딩용. 계약이 image:render 의 출력 형식을 무손실 WebP 로 못 박고
    # 있어 인코더가 런타임 필수입니다 (검증 1순위 지표가 그려진 글자라 손실 압축 불가).
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # SonarQube Cloud 커버리지 리포트용 — 이유는 apps/backend/pyproject.toml 참고.
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    # 계약 준수 테스트가 packages/contracts/openapi.yaml 을 직접 읽습니다 (dev 전용).
    "pyyaml>=6.0",
    # ⚠️ 버전 고정 이유와 함께 올려야 할 파일 목록은 apps/backend/pyproject.toml 참고.
    #    네 곳(여기·backend·.pre-commit-config.yaml·reviewdog.yml의 RUFF_VERSION)이
    #    항상 같은 버전이어야 합니다.
    "ruff==0.16.4",
    "mypy>=1.10.0",
]
# ── 외부 이미지 생성 API 클라이언트 (ADR-0003).
#    core 가 아닌 이유는 CI 와 스텁 모드가 이것 없이 돌아야 하기 때문입니다 - 키가 없는
#    환경에서 SDK 만 설치돼 있어 봐야 하는 일이 없고, 있으면 CI 설치 시간만 늘어납니다.
#    `ai_engine.render` 가 이 패키지를 **지연 import** 하므로 없어도 기동합니다.
#    실제 렌더를 돌리는 환경에서만: pip install -e "./apps/ai-engine[model]"
model = [
    "openai>=1.30.0",
]

# ── RAG 스택은 무거우므로 core가 아닌 extra로 분리합니다 (CI를 가볍게 유지).
#    실제 개발 시: pip install -e "./apps/ai-engine[rag]"
# rag = [
#     "langchain>=0.2.0",
#     "chromadb>=0.5.0",
#     "openai>=1.30.0",
# ]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.mypy]
# pydantic 플러그인이 없으면 alias 를 준 필드의 생성자 인자를 alias 이름으로만 인식해,
# populate_by_name=True 로 허용된 파이썬 이름 호출이 call-arg 오류로 잡힙니다
# (SingleAdDraft.ad_copy / alias="copy" 가 그 경우). 플러그인은 그 설정을 읽습니다.
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src"]
mypy_path = ["src"]
ignore_missing_imports = false
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# ⚠️ optional extra 는 CI 에 설치되지 않으므로 스텁을 찾지 못합니다. `ignore_missing_imports`
#    가 전역으로 false 라, extra 를 하나 쓰기 시작할 때마다 여기 예외를 함께 넣어야 합니다.
#    (실측: `[model]` 을 추가하고 예외를 빼먹어 CI 의 mypy 만 빨갛게 났습니다 - 로컬에는
#    `openai` 가 우연히 설치돼 있어 통과했습니다.)
[[tool.mypy.overrides]]
module = ["openai.*"]
ignore_missing_imports = true

# RAG extra는 타입 스텁이 없으므로 도입 시 아래 예외를 켜세요.
# [[tool.mypy.overrides]]
# module = ["langchain.*", "chromadb.*"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
# eval/도 수집 대상입니다 — 지표 함수는 제출물/보고서의 근거가 되는 코드라 CI에서 회귀
# 검사돼야 합니다. 다만 채점 하네스 "실행"은 외부 API 호출이라 CI 범위 밖입니다:
# ⚠️ eval/ 안에서 test_*.py 이름은 순수 지표 함수 단위 테스트에만 쓰세요.
#    실제 채점 실행 스크립트는 run_*.py 처럼 test_ 로 시작하지 않게 이름 지어야
#    CI가 외부 API를 호출하지 않습니다(비용·비결정성).
testpaths = ["tests", "eval"]
