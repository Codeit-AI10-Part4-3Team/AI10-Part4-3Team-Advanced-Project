# SonarQube Cloud (구 SonarCloud) 분석 설정 — .github/workflows/sonarqube.yml 이 읽습니다.
#
# 사전 준비 (사람이 1회 수행, 자동화 불가):
#   1) https://sonarcloud.io 에서 GitHub 계정으로 로그인 -> 조직 임포트 -> 이 레포 추가
#   2) 프로젝트 설정 > Analysis Method 에서 "Automatic Analysis"를 **끄세요**.
#      ⚠️ 켜져 있으면 아래 CI 기반 스캔이 "이미 자동 분석 중"이라며 실패합니다. 둘 중 하나만 씁니다.
#      CI 기반을 쓰는 이유: 자동 분석은 커버리지 리포트를 읽지 못합니다.
#   3) My Account > Security 에서 토큰 발급 -> 레포 Settings > Secrets 에 SONAR_TOKEN 등록
#
# ⚠️ 아래 두 키는 SonarQube Cloud 프로젝트 페이지에 표시된 값과 **정확히** 일치해야 합니다.
#    (GitHub에서 임포트하면 보통 organization=<owner 소문자>, projectKey=<owner>_<repo> 입니다.)
#    organization 키는 대문자를 허용하지 않으므로, owner에 대문자가 있으면 소문자로 고쳐 적으세요.
sonar.organization=codeit-ai10-part4-3team
sonar.projectKey=Codeit-AI10-Part4-3Team_AI10-Part4-3Team-Advanced-Project

# ── 분석 대상 ────────────────────────────────────────────────────────────────
# ⚠️ sources와 tests는 겹치면 안 됩니다(겹치면 스캐너가 에러로 중단).
#    앱을 추가하면 두 줄과 아래 coverage.reportPaths 를 함께 갱신하세요.
sonar.sources=apps/backend/src,apps/ai-engine/src,packages,scripts
sonar.tests=apps/backend/tests,apps/ai-engine/tests,apps/ai-engine/eval,e2e

# 프론트엔드는 스캐폴딩 전이라 비워둡니다. apps/frontend 생성 후 위 sources에
# apps/frontend/src 를 추가하고, node_modules/빌드 산출물은 exclusions에 넣으세요.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.venv/**,**/*.egg-info/**,notebooks/**,**/*.ipynb

# 노트북은 분석에서 제외합니다 — 출력 셀이 stripped된 실험 기록이라 품질 지표를 왜곡합니다
# (nbstripout 규약: .pre-commit-config.yaml 참고).

# ── 언어별 설정 ──────────────────────────────────────────────────────────────
# apps/*/pyproject.toml 의 requires-python 과 싱크 유지.
sonar.python.version=3.12

# 워크플로가 레포 루트에 생성하는 파일명과 일치해야 합니다.
# ⚠️ 파일이 없으면 스캐너는 경고만 남기고 커버리지를 0%로 보고합니다 — Quality Gate가
#    "새 코드 커버리지" 조건에서 조용히 실패하는 흔한 원인입니다.
sonar.python.coverage.reportPaths=coverage-backend.xml,coverage-ai-engine.xml

# scripts/ 는 분석은 받되 커버리지 산정에서는 뺍니다.
# ⚠️ 이것은 기준을 낮추는 예외가 아니라 **측정 불가능한 조건을 요구하지 않기 위한 것**입니다.
#    scripts/ 는 sources 에는 있지만 위 reportPaths 어디에도 들어올 수 없습니다 — 커버리지 XML은
#    두 앱에서만 나오고, scripts/ 에는 테스트 홈 자체가 없습니다(루트 pytest는 두 앱이 한 세션에
#    섞여 깨지므로 금지 — AGENTS.md "빌드 / 실행 / 테스트").
#    빼지 않으면 setup-dev.sh·run-tests.sh·check_ruff_sync.py 처럼 **툴링을 고치는 모든 PR이**
#    "0.0% Coverage on New Code" 로 Quality Gate 를 떨어뜨립니다(실측: PR #16).
#    Sonar 는 이 설정과 무관하게 scripts/ 의 버그·코드스멜은 계속 보고합니다.
#    scripts/ 에 테스트 하네스와 커버리지 수집을 붙이게 되면 이 줄을 지우세요.
sonar.coverage.exclusions=scripts/**

# 계약 스키마의 앱 간 중복은 **구조가 강제하는 것**이라 중복 검사에서 뺍니다.
# ⚠️ 이것도 기준을 낮추는 예외가 아닙니다. 두 앱은 서로를 import할 수 없고(AGENTS.md
#    "아키텍처 경계") 허용된 결합은 packages/contracts 의 HTTP 계약뿐이므로, 양쪽이 같은
#    계약을 각자 pydantic 으로 옮기는 것 외에 방법이 없습니다. 코드를 공유해 중복을 없애면
#    "독립 배포 가능한 AI 모듈"이라는 성질이 사라집니다 — 즉 Sonar 가 가리키는 중복은
#    설계의 산물이고, 그것을 없애는 변경이 오히려 설계 위반입니다.
#    드리프트는 코드 공유가 아니라 **각 앱의 계약 준수 테스트**가 막습니다
#    (packages/contracts/README.md "검증은 두 겹").
#
# ⚠️ 글로브가 아니라 **파일을 하나씩 적습니다.** `**/models/**` 로 뭉뚱그리면 한쪽 앱에만
#    있는 스키마(session·job 등)의 진짜 중복까지 조용히 가려집니다. 계약 스키마가 새로
#    양쪽에 생길 때마다 이 목록에 한 줄씩 추가하세요 — 추가 자체가 리뷰를 거치게 됩니다.
sonar.cpd.exclusions=apps/backend/src/backend_core/models/common.py,apps/ai-engine/src/ai_engine/models/common.py,apps/backend/src/backend_core/models/brief.py,apps/ai-engine/src/ai_engine/models/brief.py,apps/backend/src/backend_core/models/draft.py,apps/ai-engine/src/ai_engine/models/draft.py,apps/backend/src/backend_core/models/generation.py,apps/ai-engine/src/ai_engine/models/generation.py

sonar.sourceEncoding=UTF-8
